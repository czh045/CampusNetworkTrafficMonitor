<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时监控 - 校园网流量分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #1e293b;
        }

        .refresh-time {
            color: #64748b;
            font-size: 0.9rem;
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #edf0f5;
        }

        .stat-card h3 {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.2;
        }

        .stat-unit {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-left: 5px;
        }

        .chart-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #edf0f5;
            height: 400px;
        }

        .device-table {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #edf0f5;
        }

        .device-table h3 {
            margin-bottom: 15px;
            color: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 10px;
            color: #64748b;
            font-weight: 500;
            font-size: 0.9rem;
            border-bottom: 2px solid #e9edf2;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e9edf2;
            color: #334155;
        }

        .badge {
            background: #10b981;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <div class="header">
            <h1> 实时流量监控</h1>
            <div class="refresh-time" id="refreshTime">更新于: 刚刚</div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3> 总入流量</h3>
                <div>
                    <span class="stat-value" id="totalIn">0.00</span>
                    <span class="stat-unit">Mbps</span>
                </div>
            </div>
            <div class="stat-card">
                <h3> 总出流量</h3>
                <div>
                    <span class="stat-value" id="totalOut">0.00</span>
                    <span class="stat-unit">Mbps</span>
                </div>
            </div>
            <div class="stat-card">
                <h3> 总流量</h3>
                <div>
                    <span class="stat-value" id="totalTraffic">0.00</span>
                    <span class="stat-unit">Mbps</span>
                </div>
            </div>
            <div class="stat-card">
                <h3> 在线设备</h3>
                <div>
                    <span class="stat-value" id="deviceCount">0</span>
                    <span class="stat-unit">台</span>
                </div>
            </div>
            <div class="stat-card">
                <h3> 峰值流量</h3>
                <div>
                    <span class="stat-value" id="peakTraffic">0</span>
                    <span class="stat-unit">Mbps</span>
                </div>
            </div>
        </div>

        <!-- 流量趋势图 -->
        <div class="chart-container">
            <div id="trafficChart" style="width: 100%; height: 100%;"></div>
        </div>

        <!-- 设备列表 -->
        <div class="device-table">
            <h3> 设备实时状态</h3>
            <table id="deviceTable">
                <thead>
                    <tr>
                        <th>设备名称</th>
                        <th>入流量 (Mbps)</th>
                        <th>出流量 (Mbps)</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="deviceList">
                    <tr>
                        <td colspan="4" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 初始化图表
        var chart = echarts.init(document.getElementById('trafficChart'));
        var option = {
            title: {
                text: '流量趋势 (最近10分钟)',
                left: 'center',
                top: 0,
                textStyle: { fontSize: 14, color: '#334155' }
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' }
            },
            legend: {
                data: ['入流量', '出流量'],
                top: 30,
                left: 'center'
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: [],
                axisLabel: { rotate: 30 }
            },
            yAxis: {
                type: 'value',
                name: 'Mbps'
            },
            series: [
                {
                    name: '入流量',
                    type: 'line',
                    smooth: true,
                    data: [],
                    itemStyle: { color: '#3b82f6' },
                    areaStyle: { color: 'rgba(59, 130, 246, 0.1)' }
                },
                {
                    name: '出流量',
                    type: 'line',
                    smooth: true,
                    data: [],
                    itemStyle: { color: '#10b981' },
                    areaStyle: { color: 'rgba(16, 185, 129, 0.1)' }
                }
            ]
        };
        chart.setOption(option);

        function updateTraffic() {
            $.get('/api/traffic/now', function (res) {
                console.log('实时数据:', res);

                // 处理总流量
                $('#totalIn').text((res.total_in || 0).toFixed(2));
                $('#totalOut').text((res.total_out || 0).toFixed(2));
                $('#totalTraffic').text(((res.total_in || 0) + (res.total_out || 0)).toFixed(2));
                $('#peakTraffic').text(((res.peak_traffic !== undefined ? res.peak_traffic : Math.max(res.total_in || 0, res.total_out || 0)) || 0).toFixed(2));
                $('#deviceCount').text(res.online_count || res.devices?.length || 0);

                // 处理设备列表
                let devices = res.devices || [];
                let html = '';

                if (devices.length === 0) {
                    html = '<tr><td colspan="4" class="loading">暂无设备数据</td></tr>';
                } else {
                    for (let i = 0; i < devices.length; i++) {
                        let d = devices[i];
                        let inRate = parseFloat(d.in_rate) || 0;
                        let outRate = parseFloat(d.out_rate) || 0;
                        let deviceName = d.device_name || d.name || '-';
                        let status = inRate > 0 ? '<span class="badge">在线</span>' : '<span style="color:#94a3b8">离线</span>';

                        html += '<tr>' +
                            '<td>' + deviceName + '</td>' +
                            '<td>' + inRate.toFixed(2) + '</td>' +
                            '<td>' + outRate.toFixed(2) + '</td>' +
                            '<td>' + status + '</td>' +
                            '</tr>';
                    }
                }
                $('#deviceList').html(html);

            }).fail(function () {
                console.log('获取实时数据失败');
                $('#deviceList').html('<tr><td colspan="4" class="loading">加载失败</td></tr>');
            });
        }

        // 更新历史趋势
        function updateHistory() {
            $.get('/api/traffic/history', function (data) {
                console.log('历史数据:', data);

                if (!data || data.length === 0) {
                    console.log('无历史数据');
                    return;
                }

                // 提取时间和流量数据
                var times = [];
                var inData = [];
                var outData = [];

                for (var i = 0; i < data.length; i++) {
                    times.push(data[i].time);
                    inData.push(data[i].avg_in || data[i].in_rate || 0);
                    outData.push(data[i].avg_out || data[i].out_rate || 0);
                }

                console.log('时间点:', times);
                console.log('入流量数据:', inData);

                chart.setOption({
                    xAxis: { data: times },
                    series: [
                        { data: inData, name: '入流量' },
                        { data: outData, name: '出流量' }
                    ]
                });
            }).fail(function () {
                console.log('获取历史数据失败');
            });
        }
        // 更新时间显示
        function updateTime() {
            var now = new Date();
            $('#refreshTime').text(`更新于: ${now.toLocaleTimeString()}`);
        }

        // 刷新所有数据
        function refreshAll() {
            updateTraffic();
            updateHistory();
            updateTime();
        }

        // 每秒刷新一次
        setInterval(refreshAll, 3000);

        // 页面加载立即刷新
        $(document).ready(function () {
            refreshAll();
        });
    </script>
</body>

</html>
