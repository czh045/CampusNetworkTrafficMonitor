{% extends "base.html" %}
{% block title %}用户控制台{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title"> 欢迎回来，{{ session.username }}</div>
    <p>系统运行状态：<span class="status-online">● 正常</span></p>
</div>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
    <div class="card">
        <h3> 今日总流量</h3>
        <div style="font-size: 2rem; font-weight: bold;" id="todayTotal">--</div>
    </div>
    <div class="card">
        <h3> 在线设备</h3>
        <div style="font-size: 2rem; font-weight: bold;" id="onlineDevices">--</div>
    </div>
    <div class="card">
        <h3> 活跃告警</h3>
        <div style="font-size: 2rem; font-weight: bold; color: #ef4444;" id="activeAlerts">--</div>
    </div>
</div>

<div class="card">
    <div class="card-title"> 功能入口</div>
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
        <a href="/dashboard" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>实时监控</div>
        </a>
        <a href="/traffic/analysis" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>流量分析</div>
        </a>
        <a href="/alerts" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>告警中心</div>
        </a>
    </div>
</div>

<script>
$.get('/api/analysis/traffic-summary', function(data) {
    $('#todayTotal').text(data.today_total_gb);
    $('#onlineDevices').text(data.total_devices);
});
$.get('/api/alerts/statistics', function(data) {
    $('#activeAlerts').text(data.active);
});
</script>
{% endblock %}
