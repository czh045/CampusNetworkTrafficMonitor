{% extends "base.html" %}
{% block title %}管理员控制台{% endblock %}
{% block content %}
<div class="card">
    <div class="card-title"> 欢迎回来，管理员 {{ session.username }}</div>
    <p>系统运行状态：<span class="status-online">● 正常</span></p>
    <p>最后更新: <span id="updateTime">--</span></p>
</div>

<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px;">
    <div class="card">
        <h3> 今日总流量</h3>
        <div style="font-size: 2rem; font-weight: bold;" id="todayTotal">--</div>
        <div>GB</div>
    </div>
    <div class="card">
        <h3> 在线设备</h3>
        <div style="font-size: 2rem; font-weight: bold;" id="onlineDevices">--</div>
        <div>台设备在线</div>
    </div>
    <div class="card">
        <h3> 活跃告警</h3>
        <div style="font-size: 2rem; font-weight: bold; color: #ef4444;" id="activeAlerts">--</div>
        <div>条未处理</div>
    </div>
    <div class="card">
        <h3> 在线用户</h3>
        <div style="font-size: 2rem; font-weight: bold;" id="onlineUsers">--</div>
        <div>人</div>
    </div>
</div>

<div class="card">
    <div class="card-title"> 快速入口</div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
        <a href="/dashboard" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>实时监控</div>
        </a>
        <a href="/traffic/analysis" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>流量分析</div>
        </a>
        <a href="/alerts" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>告警中心</div>
        </a>
        <a href="/devices" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>设备管理</div>
        </a>
        <a href="/admin/users" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>用户管理</div>
        </a>
        <a href="/system/logs" style="text-decoration: none; background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; color: #2b3a67;">
            <div style="font-size: 2rem;"></div>
            <div>系统日志</div>
        </a>
    </div>
</div>

<script>
function loadDashboardStats() {
    $.get('/api/analysis/traffic-summary', function(data) {
        $('#todayTotal').text(data.today_total_gb);
        $('#onlineDevices').text(data.total_devices);
        $('#updateTime').text(new Date().toLocaleTimeString());
    });
    $.get('/api/alerts/statistics', function(data) {
        $('#activeAlerts').text(data.active);
    });
    $.get('/api/admin/users/list', function(users) {
        let online = users.filter(u => u.last_login && new Date() - new Date(u.last_login) < 5*60*1000).length;
        $('#onlineUsers').text(online);
    });
}
loadDashboardStats();
setInterval(loadDashboardStats, 10000);
</script>
{% endblock %}
