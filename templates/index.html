<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络流量监控平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;  /* 浅灰白色背景 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: white;  /* 纯白色登录框 */
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);  /* 更淡的阴影 */
            border: 1px solid #edf0f5;  /* 浅灰色边框增加立体感 */
        }

        .login-box h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }

        .login-box h2 {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 400;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e9edf2;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #fafbfc;  /* 输入框浅灰色，与登录框白色区分 */
        }

        .form-control:focus {
            outline: none;
            border-color: #2b3a67;
            background: white;
            box-shadow: 0 0 0 3px rgba(43, 58, 103, 0.08);
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: #d6119b;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin: 1.5rem 0 0.75rem;
        }

        .btn-login:hover {
            background: #d6119b
        }

        .btn-register {
            display: block;
            width: 100%;
            padding: 0.875rem;
            background: white;
            color: #d6119b;
            border: 1px solid #d0d9e8;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-register:hover {
            background: #f5f7fb;
            border-color: #2b3a67;
            text-decoration: none;
        }

        .optional-tag {
            font-weight: 400;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>网络流量监控平台</h1>
        <h2>登录你的账号</h2>

        <form method="post" action="/show/infer">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="form-control" name="name" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-control" name="password" placeholder="请输入密码" required>
            </div>

            <div class="form-group">
                <label>邮箱 <span class="optional-tag">可选</span></label>
                <input type="email" class="form-control" name="email" placeholder="your@email.com">
            </div>

            <button type="submit" class="btn-login">登录</button>
            <a href="/get/register" class="btn-register">注册新账号</a>
        </form>
    </div>
</body>
</html>
