{% extends "base.html" %}
{% block title %}流量分析{% endblock %}
{% block content %}
<style>
    .prediction-fixed-container {
        width: 100%;
        min-width: 800px;
        height: 450px;
        background: white;
        border-radius: 16px;
        padding: 15px;
        margin-top: 15px;
        overflow-x: auto;
    }
    #predictionChart {
        width: 100%;
        height: 100%;
        min-height: 400px;
    }
    .card {
        overflow-x: auto;
    }
    .btn-sm {
        padding: 6px 12px;
        margin: 0 4px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        background: #f1f5f9;
        color: #334155;
        font-size: 0.875rem;
    }
    .btn-primary {
        background: #2b3a67;
        color: white;
    }
    .chart-box {
        background: white;
        border-radius: 16px;
        padding: 15px;
        height: 350px;
    }
    .device-table {
        background: white;
        border-radius: 16px;
        padding: 15px;
        margin-top: 20px;
        overflow-x: auto;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 600px;
    }
    th, td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #e9edf2;
    }
    .prediction-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px;
        padding: 20px;
        color: white;
        margin-bottom: 15px;
    }
    .prediction-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 10px;
    }
    .analysis-summary {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }
    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-top: 15px;
    }
    .metric-card {
        background: #ffffff;
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 1px 8px rgba(15, 23, 42, 0.06);
    }
    .metric-card-title {
        color: #475569;
        font-size: 0.85rem;
        margin-bottom: 8px;
    }
    .metric-card-value {
        font-size: 1.35rem;
        font-weight: 700;
    }
    .prediction-stat {
        text-align: center;
    }
    .prediction-stat-value {
        font-size: 1.8rem;
        font-weight: bold;
    }
</style>

<div class="card">
    <div class="card-title" style="display: flex; justify-content: space-between;">
        <span>📊 流量深度分析</span>
        <div>
            <button class="btn-sm" onclick="changePeriod('day')">今日</button>
            <button class="btn-sm" onclick="changePeriod('week')">本周</button>
            <button class="btn-sm" onclick="changePeriod('month')">本月</button>
            <button class="btn-sm btn-primary" onclick="togglePrediction()">📈 预测</button>
        </div>
    </div>

    <!-- 模型评估仪表板 -->
    <div class="analysis-summary">
        <div class="metric-card" style="padding: 20px;">
            <h3 style="margin: 0 0 12px;">模型评估仪表板</h3>
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-card-title">模型状态</div>
                    <div class="metric-card-value" id="modelMode">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-card-title">训练样本数</div>
                    <div class="metric-card-value" id="modelSamples">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-card-title">RMSE 入</div>
                    <div class="metric-card-value" id="rmseIn">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-card-title">RMSE 出</div>
                    <div class="metric-card-value" id="rmseOut">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-card-title">MAE 入</div>
                    <div class="metric-card-value" id="maeIn">--</div>
                </div>
                <div class="metric-card">
                    <div class="metric-card-title">MAE 出</div>
                    <div class="metric-card-value" id="maeOut">--</div>
                </div>
            </div>
        </div>
        <div style="margin-top: 12px; color: #64748b; font-size: 0.95rem;" id="modelNote"></div>
    </div>

    <!-- 预测面板 -->
    <div id="predictionPanel" style="display: none;">
        <div class="prediction-header">
            <h3>🔮 未来流量预测</h3>
            <div class="prediction-stats">
                <div class="prediction-stat">
                    <div style="font-size:0.8rem;">预测峰值</div>
                    <div class="prediction-stat-value" id="predPeak">--</div>
                    <div id="predPeakHour" style="font-size:0.8rem;"></div>
                </div>
                <div class="prediction-stat">
                    <div style="font-size:0.8rem;">平均预测</div>
                    <div class="prediction-stat-value" id="predAvg">--</div>
                </div>
                <div class="prediction-stat">
                    <div style="font-size:0.8rem;">置信度</div>
                    <div class="prediction-stat-value" id="predConfidence">85%</div>
                </div>
            </div>
        </div>
        <div class="prediction-fixed-container">
            <div id="predictionChart"></div>
        </div>
    </div>

    <!-- 历史面板 -->
    <div id="historyPanel">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
            <div class="chart-box">
                <div id="trendChart" style="width:100%; height:100%;"></div>
            </div>
            <div class="chart-box">
                <div id="protocolChart" style="width:100%; height:100%;"></div>
            </div>
        </div>
        <div class="device-table">
            <h3>🏆 设备流量排行</h3>
            <table id="rankingTable">
                <thead><tr><th>排名</th><th>设备名称</th><th>平均入流量</th><th>峰值</th><th>总流量</th><th>状态</th></tr></thead>
                <tbody id="deviceRanking"><tr><td colspan="6">加载中......</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

    function loadPrediction() {
    $.get('/api/predict/traffic', function(data) {
        if (data.error) {
            console.log('预测数据加载失败，使用模拟数据');
            useMockPrediction();
            return;
        }

        $('#predPeak').text(data.peak + ' Mbps');
        $('#predPeakHour').text('预计在 ' + data.peak_hour);
        $('#predAvg').text(data.avg + ' Mbps');

        if (predictionChart) {
            $('#predictionChart').width('100%').height(400);
            predictionChart.resize();

            var hours = data.hours.slice(0, 12);
            var inPredictions = data.in_predictions ? data.in_predictions.slice(0, 12) : [];
            var outPredictions = data.out_predictions ? data.out_predictions.slice(0, 12) : [];
            var totalPredictions = data.predictions.slice(0, 12);

            if (inPredictions.length > 0 && outPredictions.length > 0) {
                predictionChart.setOption({
                    title: {
                        text: '未来12小时入/出流量预测',
                        left: 'center',
                        top: 5,
                        textStyle: { fontSize: 14, fontWeight: 'normal' }
                    },
                    tooltip: {
                        trigger: 'axis',
                        formatter: function(params) {
                            var text = params[0].axisValue + '<br/>';
                            for (var i = 0; i < params.length; i++) {
                                text += params[i].marker + params[i].seriesName + ': ' + params[i].value + ' Mbps<br/>';
                            }
                            return text;
                        }
                    },
                    legend: {
                        data: ['预测入流量', '预测出流量'],
                        top: 35,
                        right: 20
                    },
                    grid: { top: 70, bottom: 35, left: 60, right: 40, containLabel: true },
                    xAxis: { type: 'category', data: hours, axisLabel: { rotate: 30, interval: 1, fontSize: 11 } },
                    yAxis: { type: 'value', name: 'Mbps' },
                    series: [
                        { name: '预测入流量', type: 'line', smooth: true, data: inPredictions, color: '#3b82f6', lineStyle: { width: 2 }, symbol: 'circle', symbolSize: 6 },
                        { name: '预测出流量', type: 'line', smooth: true, data: outPredictions, color: '#10b981', lineStyle: { width: 2 }, symbol: 'circle', symbolSize: 6 }
                    ]
                });
            } else {
                predictionChart.setOption({
                    title: { text: '未来12小时总流量预测', left: 'center', top: 5 },
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['预测总流量'], top: 35, right: 20 },
                    grid: { top: 70, bottom: 35, left: 60, right: 40 },
                    xAxis: { type: 'category', data: hours, axisLabel: { rotate: 30, interval: 1 } },
                    yAxis: { type: 'value', name: 'Mbps' },
                    series: [{ name: '预测总流量', type: 'line', smooth: true, data: totalPredictions, color: '#f59e0b', lineStyle: { width: 2 }, symbol: 'circle', symbolSize: 6 }]
                });
            }
        }

        $('#predConfidence').text(data.confidence ? data.confidence + '%' : '85%');

    }).fail(function() {
        console.log('后端接口不可用，使用模拟数据');
        useMockPrediction();
    });

    // 加载模型评估指标
    $.get('/api/predict/metrics', function(metrics) {
        if (metrics && metrics.mode === 'model') {
            $('#modelMode').text('机器学习');
            $('#modelSamples').text(metrics.samples || '--');
            $('#rmseIn').text(metrics.rmse_in ? metrics.rmse_in.toFixed(2) : '--');
            $('#rmseOut').text(metrics.rmse_out ? metrics.rmse_out.toFixed(2) : '--');
            $('#maeIn').text(metrics.mae_in ? metrics.mae_in.toFixed(2) : '--');
            $('#maeOut').text(metrics.mae_out ? metrics.mae_out.toFixed(2) : '--');
            $('#modelNote').text('基于梯度提升回归树的机器学习预测');
        } else {
            $('#modelMode').text('模拟预测');
            $('#modelSamples').text(metrics?.samples || '--');
            $('#rmseIn').text('--');
            $('#rmseOut').text('--');
            $('#maeIn').text('--');
            $('#maeOut').text('--');
            $('#modelNote').text(metrics?.message || '当前使用模拟预测模式，基于校园网流量规律展示。');
        }
    }).fail(function() {
        $('#modelMode').text('模拟预测');
        $('#modelSamples').text('--');
        $('#rmseIn').text('--');
        $('#rmseOut').text('--');
        $('#maeIn').text('--');
        $('#maeOut').text('--');
        $('#modelNote').text('当前使用模拟预测模式');
    });
}

    // 降级：模拟预测数据
    function useMockPrediction() {
        var now = new Date();
        var hours = [];
        var predictions = [];

        for (var i = 0; i < 12; i++) {
            var hour = (now.getHours() + i + 1) % 24;
            hours.push(hour + ':00');

            var base = 30;
            if (hour >= 8 && hour <= 22) {
                base = 80;
            } else if (hour >= 22 || hour <= 2) {
                base = 50;
            } else {
                base = 25;
            }

            var val = base + Math.random() * 20;
            predictions.push(Math.round(val));
        }

        var peak = Math.max.apply(null, predictions);
        var peakIndex = predictions.indexOf(peak);

        $('#predPeak').text(peak + ' Mbps');
        $('#predPeakHour').text('预计在 ' + hours[peakIndex]);
        $('#predAvg').text(Math.round(predictions.reduce(function(a,b){return a+b;},0) / predictions.length) + ' Mbps');

        if (predictionChart) {
            $('#predictionChart').width('100%').height(400);
            predictionChart.resize();

            predictionChart.setOption({
                title: { text: '未来12小时流量预测', left: 'center', top: 5 },
                tooltip: { trigger: 'axis' },
                grid: { top: 50, bottom: 35, left: 60, right: 40 },
                xAxis: { type: 'category', data: hours, axisLabel: { rotate: 30, interval: 1 } },
                yAxis: { type: 'value', name: 'Mbps' },
                series: [{ name: '预测流量', type: 'line', smooth: true, data: predictions, color: '#f59e0b' }]
            });
        }
    }

    function togglePrediction() {
        showPrediction = !showPrediction;
        if (showPrediction) {
            $('#predictionPanel').show();
            $('#historyPanel').hide();
            loadPrediction();
        } else {
            $('#predictionPanel').hide();
            $('#historyPanel').show();
            loadTrendData();
            loadDeviceRanking();
            loadProtocolStats();
        }
    }

    function changePeriod(period) {
        currentPeriod = period;
        if (!showPrediction) {
            loadTrendData();
        }
    }

    function loadTrendData() {
        $.get(`/api/analysis/traffic?period=${currentPeriod}`, function(data) {
            if (data && data.length > 0) {
                trendChart.setOption({
                    xAxis: { data: data.map(function(d) { return d.time; }) },
                    series: [
                        { data: data.map(function(d) { return d.avg_in || 0; }), name: '入流量' },
                        { data: data.map(function(d) { return d.avg_out || 0; }), name: '出流量' }
                    ]
                });
            }
        });
    }

    function loadDeviceRanking() {
        $.get('/api/analysis/top-devices?period=day&limit=10', function(devices) {
            var html = '';
            if (devices && devices.length > 0) {
                for (var i = 0; i < devices.length; i++) {
                    var d = devices[i];
                    var status = d.avg_in > 80 ? '⚠️ 繁忙' : (d.avg_in > 50 ? '📊 正常' : '✅ 空闲');
                    var statusColor = d.avg_in > 80 ? '#ef4444' : (d.avg_in > 50 ? '#f59e0b' : '#10b981');
                    html += '<tr>' +
                        '<td style="padding:10px;">' + d.rank + '</td>' +
                        '<td style="padding:10px;">' + d.device_name + '</td>' +
                        '<td style="padding:10px;">' + d.avg_in + ' Mbps</td>' +
                        '<td style="padding:10px;">' + d.max_in + ' Mbps</td>' +
                        '<td style="padding:10px;">' + d.total_gb + ' GB</td>' +
                        '<td style="padding:10px;color:' + statusColor + '">' + status + '</td>' +
                        '</tr>';
                }
            } else {
                html = '<tr><td colspan="6" style="text-align:center;">暂无数据</td></tr>';
            }
            $('#deviceRanking').html(html);
        });
    }

    function loadProtocolStats() {
        $.get('/api/analysis/protocol-stats', function(data) {
            protocolChart.setOption({ series: [{ data: data }] });
        });
    }

    $(document).ready(function() {
        // 初始化趋势图
        trendChart = echarts.init(document.getElementById('trendChart'));
        trendChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['入流量', '出流量'], top: 0, right: 0 },
            grid: { top: 40, bottom: 20, left: 50, right: 30 },
            xAxis: { type: 'category', data: [] },
            yAxis: { type: 'value', name: 'Mbps' },
            series: [
                { name: '入流量', type: 'line', smooth: true, data: [], color: '#3b82f6' },
                { name: '出流量', type: 'line', smooth: true, data: [], color: '#10b981' }
            ]
        });

        // 初始化协议图
        protocolChart = echarts.init(document.getElementById('protocolChart'));
        protocolChart.setOption({
            tooltip: { trigger: 'item' },
            legend: { orient: 'vertical', left: 'left', top: 'center' },
            series: [{ type: 'pie', radius: ['40%', '70%'], data: [] }]
        });

        // 初始化预测图
        predictionChart = echarts.init(document.getElementById('predictionChart'));

        // 加载数据
        loadTrendData();
        loadDeviceRanking();
        loadProtocolStats();
    });
</script>
